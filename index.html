<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBC 2.0 Meals Tracking</title>
<style>
  :root {
    --bg: #f5f7f4;
    --surface: #ffffff;
    --ink: #17231c;
    --muted: #5d6b63;
    --line: #d8dfd9;
    --accent: #1f6f4a;
    --accent-ink: #ffffff;
    --taken: #1f6f4a;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101713;
      --surface: #19231d;
      --ink: #e8efe9;
      --muted: #93a39a;
      --line: #2b3a31;
      --accent: #4cc38a;
      --accent-ink: #08140d;
      --taken: #4cc38a;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  button, input {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--line);
    min-height: 44px;
    color: var(--ink);
    background: var(--surface);
  }
  button { cursor: pointer; padding: 0 16px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; padding: 0 12px; min-width: 0; }
  #reader { width: 100%; margin-top: 12px; border-radius: 8px; overflow: hidden; }
  #status { min-height: 1.4em; margin: 0 0 12px; color: var(--muted); }
  #status.error { color: var(--error); }
  .team-name { font-size: 1.2rem; font-weight: 700; margin: 0; }
  .team-meta { color: var(--muted); margin: 4px 0 0; }
  .member { border-top: 1px solid var(--line); padding: 12px 0; }
  .member:first-of-type { border-top: 0; }
  .member-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
  .member-name { font-weight: 600; }
  .present-tag { font-size: .85rem; color: var(--muted); }
  .present-tag.yes { color: var(--taken); }
  .meals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .meal-btn { padding: 0 6px; }
  .meal-btn.taken { background: var(--taken); border-color: var(--taken); color: var(--accent-ink); font-weight: 600; }
  .meal-btn:disabled { opacity: .6; cursor: progress; }
  @media (prefers-reduced-motion: no-preference) {
    .meal-btn { transition: background-color .15s, color .15s; }
  }
</style>
</head>
<body>
<main>
  <h1>CBC 2.0 Meals Tracking</h1>

  <section class="panel" aria-label="Find a team">
    <div class="row">
      <button id="scan-btn" class="primary" type="button">Scan QR</button>
      <input id="team-input" type="text" placeholder="Or type team ID" autocomplete="off" aria-label="Team ID">
      <button id="load-btn" type="button">Look up</button>
    </div>
    <div id="reader"></div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="team" class="panel" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // Fallback CDN if the first one is blocked or fails
  if (typeof Html5Qrcode === "undefined") {
    document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');
  }
</script>
<script>
  const MEALS = ["lunch", "dinner", "tiffin"];
  const SUCCESS_BUZZ = 200;
  const ERROR_BUZZ = [100, 60, 100];

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const teamEl = $("team");
  let scanner = null;
  let currentTeamId = null;

  function vibrate(pattern) {
    // Android browsers only; silently ignored on iOS / desktop.
    if ("vibrate" in navigator) navigator.vibrate(pattern);
  }

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  async function loadTeam(teamId) {
    teamId = (teamId || "").trim();
    if (!teamId) return;
    setStatus("Loading team…");
    try {
      const res = await fetch("/api/team?team_id=" + encodeURIComponent(teamId));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not load team");
      currentTeamId = data.team_id;
      renderTeam(data);
      setStatus("");
      return true;
    } catch (err) {
      teamEl.hidden = true;
      setStatus(err.message, true);
      vibrate(ERROR_BUZZ);
      return false;
    }
  }

  function renderTeam(t) {
    const meta = [t.project_title, t.table_number ? "Table " + t.table_number : ""]
      .filter(Boolean).join(" · ");
    teamEl.hidden = false;
    teamEl.innerHTML = `
      <p class="team-name">${esc(t.team_name || t.team_id)}</p>
      <p class="team-meta">${esc(meta)}</p>
      <div>
        ${t.members.map((m) => `
          <div class="member">
            <div class="member-head">
              <span class="member-name">${esc(m.name)}</span>
              <span class="present-tag ${m.present ? "yes" : ""}">${m.present ? "Checked in" : "Not checked in"}</span>
            </div>
            <div class="meals">
              ${MEALS.map((meal) => `
                <button type="button"
                        class="meal-btn ${m[meal] ? "taken" : ""}"
                        data-row="${m.row}" data-meal="${meal}" data-taken="${m[meal]}"
                        aria-pressed="${m[meal]}">
                  ${cap(meal)}${m[meal] ? " ✓" : ""}
                </button>`).join("")}
            </div>
          </div>`).join("")}
      </div>`;
  }

  teamEl.addEventListener("click", async (e) => {
    const btn = e.target.closest(".meal-btn");
    if (!btn) return;
    const row = Number(btn.dataset.row);
    const meal = btn.dataset.meal;
    const taken = btn.dataset.taken !== "true"; // toggle
    btn.disabled = true;
    try {
      const res = await fetch("/api/mark", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ row, meal, taken }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not save");
      vibrate(100);
      await loadTeam(currentTeamId);
    } catch (err) {
      btn.disabled = false;
      setStatus(err.message, true);
      vibrate(ERROR_BUZZ);
    }
  });

  async function stopScanner() {
    if (!scanner) return;
    try { await scanner.stop(); } catch (_) {}
    try { scanner.clear(); } catch (_) {}
    scanner = null;
    $("scan-btn").textContent = "Scan QR";
  }

  function cameraErrorMessage(err) {
    const t = String((err && (err.name || err.message)) || err);
    if (/NotAllowed|Permission|denied/i.test(t))
      return "Camera permission is blocked. Tap the lock icon in the address bar, allow Camera, then try again.";
    if (/NotFound|no camera|Requested device not found/i.test(t))
      return "No camera found on this device.";
    if (/NotReadable|TrackStart|in use/i.test(t))
      return "Camera is in use by another app. Close it and try again.";
    return "Camera could not start (" + t + "). Type the team ID instead.";
  }

  async function startScanner() {
    if (typeof Html5Qrcode === "undefined") {
      setStatus("Scanner failed to load. Check your internet connection and reload the page.", true);
      return;
    }
    if (!window.isSecureContext) {
      setStatus("Camera needs HTTPS. Open the https:// link of this site.", true);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser can't access the camera. Open the page in Chrome or Safari, not inside WhatsApp, Instagram or another app.", true);
      return;
    }

    setStatus("");
    scanner = new Html5Qrcode("reader");
    $("scan-btn").textContent = "Stop scanning";

    const config = { fps: 10, qrbox: { width: 240, height: 240 } };
    const onScan = async (decodedText) => {
      vibrate(SUCCESS_BUZZ); // buzz as soon as a QR code is read
      await stopScanner();
      $("team-input").value = decodedText;
      loadTeam(decodedText);
    };

    try {
      await scanner.start({ facingMode: "environment" }, config, onScan, () => {});
    } catch (err1) {
      // Fallback: pick a camera by id (works on laptops / phones that reject facingMode)
      try {
        const cams = await Html5Qrcode.getCameras();
        if (!cams || !cams.length) throw err1;
        const back = cams.find((c) => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
        await scanner.start(back.id, config, onScan, () => {});
      } catch (err2) {
        await stopScanner();
        setStatus(cameraErrorMessage(err2), true);
        vibrate(ERROR_BUZZ);
      }
    }
  }

  $("scan-btn").addEventListener("click", () => (scanner ? stopScanner() : startScanner()));
  $("load-btn").addEventListener("click", () => loadTeam($("team-input").value));
  $("team-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadTeam(e.target.value);
  });
</script>
</body>
</html>
